services:
  web:
    build: .
    container_name: my_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  # ==================== Worker پیش‌فرض ====================
  celery:
    build: .
    container_name: my_celery
    command: celery -A celery_app worker -Q default -l info --concurrency=4
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  # ==================== Worker تسک‌های سنگین ====================
  celery-heavy:
    build: .
    container_name: my_celery_heavy
    command: celery -A celery_app worker -Q heavy -l info --concurrency=2
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  # ==================== Beat ====================
  celery-beat:
    build: .
    container_name: my_celery_beat
    command: celery -A celery_app beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  # ==================== Flower ====================
  flower:
    build: .
    container_name: my_flower
    command: celery -A celery_app --broker=redis://redis:6379/0 flower --port=5555
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
      - celery
      - celery-heavy

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: my_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: